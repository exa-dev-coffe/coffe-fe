name: Build & Deploy Frontend to K3s (Kubernetes) via GHCR

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on:
      ubuntu-latest

      # Biar bisa push commit
    permissions:
      contents: write
      pull-requests: read

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup git identity
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

      - name: Bump version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          CURRENT=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BUMP="patch"

          # Ambil PR number dari merge commit
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oE '#([0-9]+)' | tr -d '#' || true)

          if [ -n "$PR_NUMBER" ]; then
            echo "🔍 Checking PR #$PR_NUMBER comments..."

            COMMENTS=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/$PR_NUMBER/comments")

            if echo "$COMMENTS" | grep -qi "/version major"; then
              BUMP="major"
            elif echo "$COMMENTS" | grep -qi "/version minor"; then
              BUMP="minor"
            elif echo "$COMMENTS" | grep -qi "/version patch"; then
              BUMP="patch"
            fi
          else
            echo "ℹ️ No PR detected, default patch"
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR+1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH+1)) ;;
          esac

          NEXT="$MAJOR.$MINOR.$PATCH"

          echo "🔖 Version bump ($BUMP): v$CURRENT → v$NEXT"

          echo "$NEXT" > VERSION
          echo "VERSION=$NEXT" > version.env

          git add VERSION
          git commit -m "chore(version): bump to v$NEXT"
          git push origin main

          cat version.env

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.env

      # 2️⃣ Get short SHA
      - name: Get Commit SHA (short)
        id: vars
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # 3️⃣ Setup Node for Vite build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4️⃣ Create .env from GitHub Secrets
      - name: Create .env
        run: |
          echo "VITE_APP_API_URL=${{ secrets.VITE_APP_API_URL }}" > .env
          echo "VITE_APP_CLIENT_KEY_MIDTRANS=${{ secrets.VITE_APP_CLIENT_KEY_MIDTRANS }}" >> .env

      # 5️⃣ Build Vite
      - name: Install dependencies
        run: npm install

      - name: Build Vite
        run: npm run build

      # 6️⃣ Log in to GHCR
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" \
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 7️⃣ Build Docker Image
      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/front-end-coffe:${{ steps.vars.outputs.sha }}
          docker build -t $IMAGE .

      # 8️⃣ Push Image
      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/front-end-coffe:${{ steps.vars.outputs.sha }}
          docker push $IMAGE

      # 9️⃣ Deploy to Kubernetes (K3s)
      - name: Deploy to K3s
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 31080 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          ssh -p 31080 -i ~/.ssh/id_ed25519 deploy@${{ secrets.VPS_HOST }} << EOF
            export KUBECONFIG=/home/deploy/.kube/config

            NEW_IMAGE="ghcr.io/${{ github.repository_owner }}/front-end-coffe:${{ steps.vars.outputs.sha }}"

            # Patch deployment di namespace dev-coffe
            kubectl set image deployment/frontend-coffe \
              -n dev-coffe \
              frontend-coffe=\$NEW_IMAGE

            # Lihat rollout
            # kubectl rollout status deployment/front-end-coffe -n dev-coffe
          EOF
